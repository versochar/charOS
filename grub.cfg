# GRUB configuration for charOS
set timeout=1
set default=0

# Tanı için GRUB mesajları seriye (kernel COM1'i yeniden başlatır)
serial --unit=0 --speed=115200

# 18B: VESA lineer framebuffer (multiboot header video isteğiyle birlikte)
insmod all_video
set gfxmode=1024x768x32
set gfxpayload=keep

# Birincil giriş: klasik multiboot v1 (SeaBIOS/BIOS regresyon yolu).
menuentry "charOS" {
    multiboot /boot/kernel.bin
    boot
}

# 26A: multiboot2 girişleri (GRUB BIOS'ta da desteklenir; GRUB-EFI
# relocator'ı bozuk olduğundan UEFI'de BOOTX64.EFI kullanılır).
menuentry "charOS (mb2)" {
    multiboot2 /boot/kernel.bin
    boot
}

menuentry "charOS (mb2 text)" {
    set gfxpayload=text
    multiboot2 /boot/kernel.bin
    boot
}
